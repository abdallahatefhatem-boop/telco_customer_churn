name: Telco Customer Churn Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall multipart -y || true
          pip install python-multipart httpx
          pip install -e .
          
      - name: Run Tests (Pytest)
        run: |
          pytest -v tests/
          
      - name: Run Data Pipeline (Training)
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          python -m customer_churn.pipline.training_pipeline